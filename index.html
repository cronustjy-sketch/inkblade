<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}

<style>
/* Layout: one-screen game — status bar, battlefield canvas, command bar; map & results as overlays. Single dark "war tent" look by choice. */
:root{
  --ink:#13161b; --panel:#1d2229; --panel2:#262c35; --line:#38404c;
  --text:#ecebe4; --muted:#9aa2ad; --gold:#e8b44a; --blue:#5b9be6; --red:#de4b3f; --green:#6cc070;
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,sans-serif;
  --f-num:"Chakra Petch",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{max-width:1000px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-family:var(--f-display);font-size:26px;color:var(--gold);letter-spacing:1px;line-height:1}
.title small{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.12em;margin-left:6px;text-transform:uppercase}
.spacer{flex:1}
.chip{font-family:var(--f-num);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--gold)}
.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,.unit:focus-visible,.node:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{border-radius:10px;display:block;background:#2a3a2a;max-width:100%}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:8px}
.ubar{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.ubar .unit{flex:1 0 66px;padding:6px 8px;gap:0}
.ubar .unit .s{display:none}
.ubar .unit .n{font-size:18px;white-space:nowrap}
.ubar .unit .c{position:static;font-size:12px}
.ubar .unit .c.lock{color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:11px}
.unit .pop{position:absolute;top:5px;right:6px;font-family:var(--f-num);font-size:9px;color:var(--muted)}
.unit.next{border-style:dashed}
.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;min-width:0}
.ord{position:relative;font:inherit;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px;min-width:0}
.ord .n{font-family:var(--f-display);font-size:17px;line-height:1.1}
.ord .k{font-family:var(--f-num);font-size:9px;color:var(--muted)}
.ord.on{color:#1a1408;background:var(--gold);border-color:var(--gold)}
.ord.on .k{color:#5a4a1e}
.ord:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctrl{display:flex;gap:8px}
.pad{display:flex;gap:8px}
.mv{font:inherit;font-size:22px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:64px;cursor:pointer;touch-action:none}
.mv.on{border-color:var(--gold);color:var(--gold)}
.skills{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk{position:relative;font:inherit;color:#ffd9cc;background:linear-gradient(180deg,#3a201d,var(--panel));border:1px solid #6b3a33;border-radius:10px;padding:7px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0}
.sk .n{font-family:var(--f-display);font-size:19px;line-height:1.1}
.sk .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .k{position:absolute;top:7px;right:8px;font-family:var(--f-num);font-size:11px;color:var(--gold)}
.sk .cool{position:absolute;left:0;bottom:0;height:3px;background:var(--red);width:0}
.sk:disabled{opacity:.45;cursor:not-allowed}
.sk:focus-visible,.mv:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.unit{position:relative;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.unit .n{font-family:var(--f-display);font-size:20px;line-height:1.1}
.unit .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .c{position:absolute;top:8px;right:10px;font-family:var(--f-num);font-weight:700;color:var(--gold)}
.unit .k{font-family:var(--f-num);font-size:10px;color:var(--muted);position:absolute;bottom:6px;right:10px}
.unit:disabled{opacity:.42;cursor:not-allowed}
.unit.skill{border-color:#6b3a33;background:linear-gradient(180deg,#3a201d,var(--panel))}
.unit.skill .n{color:#ffb39c}
.unit .cool{position:absolute;left:0;bottom:0;height:3px;background:var(--red);width:0}
.energy{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.energy i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862e,var(--gold))}
.overlay{position:absolute;inset:0;background:rgba(10,12,16,.86);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:2}
.overlay[hidden],#campCtrl[hidden],#pvpCtrl[hidden],#pp2[hidden]{display:none}
.campctrl{display:flex;flex-direction:column;gap:10px}
.pvpctrl{display:flex;justify-content:space-between;gap:12px}
.pp{display:grid;grid-template-columns:repeat(5,minmax(40px,60px));grid-template-rows:auto 52px;gap:6px}
.pp .pl{grid-column:1/-1;font-family:var(--f-num);font-size:12px;letter-spacing:.08em}
#pp2{margin-left:auto}
.pb{font:inherit;font-size:20px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;touch-action:none;font-family:var(--f-display)}
.pb.kick{background:linear-gradient(180deg,#5a2a18,var(--panel));border-color:#8a4a2a;color:#ffd0b0}
.pb.skill{background:linear-gradient(180deg,#2c2450,var(--panel));border-color:#5a4a9a;color:#d9c6ff}
.pb.on{border-color:var(--gold);color:var(--gold)}
.pb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.howto{max-width:860px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:#ffb02e}
.hcard p,.hcard li{font-size:13px;line-height:1.6;color:var(--text);margin:0}
.hcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.hcard b{color:var(--gold);font-weight:700}
.keys{border-collapse:collapse;font-size:13px;align-self:flex-start}
.keys td,.keys th{padding:4px 12px 4px 0;text-align:left;font-weight:400}
.keys td b{display:inline-block;font-family:var(--f-num);background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 8px;color:var(--text)}
.hcard .note{font-size:12px;color:var(--muted)}
.hcard.ctl{grid-column:1/-1}
.ctlgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cblock{display:flex;flex-direction:column;gap:8px;min-width:0}
.cblock h4{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.cblock .tip{font-size:12.5px;color:var(--muted)}
.mkeys td{vertical-align:middle}
.mkeys td b{display:inline;background:none;border:0;padding:0;font-family:inherit;color:var(--gold)}
.mkeys td:first-child{white-space:nowrap}
.bchip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 6px;margin-right:4px;font-family:var(--f-display);font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.bchip.kick{background:linear-gradient(180deg,#5a2a18,var(--panel));border-color:#8a4a2a;color:#ffd0b0}
.bchip.skill{background:linear-gradient(180deg,#2c2450,var(--panel));border-color:#5a4a9a;color:#d9c6ff}
@media (max-width:640px){.hgrid,.ctlgrid{grid-template-columns:1fr}}
.arena{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid #7a3a1c;border-radius:12px;background:linear-gradient(135deg,#3a1a12,var(--panel) 70%)}
.arena-t{display:flex;flex-direction:column;gap:2px}
.arena-n{font-family:var(--f-display);font-size:26px;color:#ffb02e}
.arena-s{font-size:13px;color:var(--muted)}
.panel{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px;margin:auto}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;color:var(--gold);text-wrap:balance;line-height:1.1}
.panel h2 small{display:block;font-family:var(--f-num);font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.panel p{margin:0;color:var(--muted);line-height:1.6;max-width:62ch}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.grow span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.grow b{font-family:var(--f-num);color:var(--gold)}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.node{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.node .lv{font-family:var(--f-num);font-size:22px;font-weight:700}
.node .st{font-size:13px;letter-spacing:2px;color:var(--gold);min-height:1.2em}
.node .tag{font-size:10px;font-family:var(--f-num);color:var(--muted);letter-spacing:.1em}
.node.boss{border-color:#7a3a33;background:linear-gradient(180deg,#341b19,var(--panel))}
.node.boss .tag{color:#ff8f7d}
.node.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.node:disabled{opacity:.35;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .n{font-family:var(--f-display);font-size:24px}
.card .e{font-size:11px;font-family:var(--f-num);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.card .d{font-size:13px;line-height:1.5}
.card .lvl{font-family:var(--f-num);font-size:12px;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stars{font-size:34px;letter-spacing:6px;color:var(--gold)}
.stars .off{color:#3a404a}
.help{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .cmd{grid-template-columns:minmax(0,1fr) 150px}.ubar .unit{flex-basis:60px}.ubar .unit .n{font-size:15px}
  .mv{width:50px}.ord .k{display:none}.ord .n{font-size:15px}.sk .s{display:none}.sk .n{font-size:17px}.unit .s{font-size:10px}.unit .n{font-size:18px}
  .map{grid-template-columns:repeat(5,1fr);gap:6px}
  .node{padding:8px 2px}.node .lv{font-size:18px}.node .st{font-size:10px;letter-spacing:0}
  .cards{grid-template-columns:repeat(2,1fr)}
  .panel h2{font-size:28px}
  .title{font-size:22px}.title small{display:none}
  .top{gap:6px}.top .btn{padding:6px 8px;font-size:12px}.chip{font-size:11px;padding:4px 6px}.title{font-size:18px}.spacer{display:none}
  .overlay{position:fixed;border-radius:0}
}
@media (max-height:520px){
  .app{padding-block:6px;gap:6px}
  .title{font-size:18px}.title small,#armyChip{display:none}
  .top{gap:6px;flex-wrap:nowrap}.top .btn{padding:5px 8px;font-size:12px}.chip{font-size:11px;padding:4px 6px}
  .pp{grid-template-rows:auto 42px;gap:4px}.pp .pl{font-size:10px}
  .unit{padding:5px 8px}.unit .n{font-size:16px}.unit .s{display:none}.sk{padding:5px 8px}.sk .s{display:none}.sk .n{font-size:16px}
}
/* forced landscape: on an upright phone the whole game is turned sideways */
body.rot{overflow:hidden}
body.rot .app{position:fixed;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;max-width:none;transform-origin:top left;transform:rotate(90deg);padding:6px 16px;gap:6px}
body.rot .title{font-size:18px}body.rot .title small,body.rot #armyChip{display:none}
body.rot .top{flex-wrap:nowrap;gap:6px}body.rot .top .btn{padding:5px 8px;font-size:12px}body.rot .chip{font-size:11px;padding:4px 6px}
body.rot .pp{grid-template-rows:auto 42px;gap:4px;grid-template-columns:repeat(5,minmax(40px,58px))}body.rot .pp .pl{font-size:10px}
body.rot .unit{padding:4px 8px}body.rot .unit .n,body.rot .sk .n{font-size:16px}body.rot .unit .s,body.rot .sk .s{display:none}body.rot .sk{padding:5px 8px}
body.rot .mv{width:54px}body.rot .cmd{grid-template-columns:minmax(0,1fr) 170px}body.rot .ubar .unit{flex-basis:60px}body.rot .ubar .unit .n{font-size:15px}body.rot .ord .k{display:none}body.rot .ord .n{font-size:15px}body.rot .cmd,body.rot .ctrl,body.rot .skills{gap:6px}body.rot .campctrl{gap:6px}
body.rot .overlay{position:absolute;border-radius:10px}
body.rot .hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.rot .ctlgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.rot .cards{grid-template-columns:repeat(4,1fr)}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">墨刃纪元<small>Chapter 1 · Grassland</small></div>
    <div class="spacer"></div>
    <span class="chip" id="lvChip">第 <b>1</b> 关</span>
    <span class="chip" id="armyChip">军队 <b>0</b>/8</span>
    <button class="btn" id="rotBtn" type="button" hidden>转屏</button>
    <button class="btn" id="bloodBtn" type="button">血效 开</button>
    <button class="btn" id="pauseBtn" type="button">暂停</button>
    <button class="btn" id="mapBtn" type="button">地图</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="960" height="420" aria-label="战场"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="campctrl" id="campCtrl">
  <div class="energy" title="能量 Energy"><i id="energyBar"></i></div>
  <div class="cmd">
    <div class="ubar" id="ubar"></div>
    <div class="orders" role="group" aria-label="全军命令">
      <button class="ord" type="button" data-o="attack"><span class="n">进攻</span><span class="k">Z</span></button>
      <button class="ord" type="button" data-o="defend"><span class="n">防守</span><span class="k">X</span></button>
      <button class="ord" type="button" data-o="retreat"><span class="n">撤退</span><span class="k">C</span></button>
    </div>
  </div>
  <div class="ctrl">
    <div class="pad"><button class="mv" id="mvL" type="button" aria-label="向左">◀</button><button class="mv" id="mvR" type="button" aria-label="向右">▶</button></div>
    <div class="skills" id="skills"></div>
  </div>
  </div>
  <div class="pvpctrl" id="pvpCtrl" hidden>
    <div class="pp" id="pp1"><span class="pl" style="color:var(--blue)">P1 蓝方</span></div>
    <div class="pp" id="pp2"><span class="pl" style="color:var(--red)">P2 红方</span></div>
  </div>
</div>

<script>
(()=>{
const W=960,H=420,GY=338;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const overlay=$('overlay');

// ---------- save ----------
const KEY='stick-legion-ch1';
let save={cleared:{},growth:{str:0,def:0,spd:0,cmd:0}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.growth)save=s;}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

const GROWTH={
  str:{n:'力量',e:'Strength',d:'所有士兵攻击 +15%，怒斩伤害提升。'},
  def:{n:'防御',e:'Defense',d:'所有士兵生命 +15%，基地生命 +60。'},
  spd:{n:'速度',e:'Speed',d:'移动与攻击速度 +10%，怒斩冷却缩短。'},
  cmd:{n:'统帅',e:'Command',d:'军队上限 +2，能量恢复 +1.5/秒。'}
};
const UNITS={
  soldier:{n:'剑兵',e:'Swordsman',d:'便宜的近战',hp:60,atk:10,range:24,speed:44,cd:.9,cost:20,pop:1,unlock:1},
  archer:{n:'弓手',e:'Archer',d:'远程射箭',hp:36,atk:9,range:155,speed:36,cd:1.35,cost:30,pop:1,unlock:2,ranged:'arrow'},
  spear:{n:'长枪兵',e:'Spearman',d:'枪长，打大块头 ×2',hp:75,atk:12,range:42,speed:40,cd:1.1,cost:35,pop:1,unlock:3},
  shield:{n:'盾卫',e:'Shield Knight',d:'重甲减伤35%，盾挡箭，盾击撞飞',hp:240,atk:15,range:26,speed:32,cd:1,cost:45,pop:1,unlock:4,armor:.35},
  witch:{n:'女巫',e:'Witch',d:'魔法球范围伤害',hp:42,atk:15,range:135,speed:32,cd:2,cost:60,pop:1,unlock:5,ranged:'orb',splash:48},

    for(let i=0;i<10;i++)P.fx.push({x:f.x,y:f.y-30+(Math.random()-.5)*40,vx:(Math.random()-.5)*80,vy:-Math.random()*60,t:.5,c:'#d9c6ff',sz:3,round:1});}
  if(k==='quake'){if(!f.ground){f.vy=1150;f.slam=1;f.vx*=.3}else shockwave(f)}
  if(k==='ice'){for(let i=0;i<16;i++)P.fx.push({x:f.x+f.face*(10+Math.random()*110),y:f.y-30+(Math.random()-.5)*40,vx:f.face*60,vy:-20,t:.5,c:'#bfe9ff',sz:3});
    const dx=(o.x-f.x)*f.face;if(o.alive&&dx>-12&&dx<130&&Math.abs(o.y-f.y)<55){
      if(o.shieldT>0){o.shieldT=0;say(o,'反弹！');f.frozen=1.2}else{o.frozen=1.5;o.pct+=5;o.vx*=.3;say(o,'冻住！','#bfe9ff')}}}
  if(k==='shield')f.shieldT=1.2;
}
function updateProj(dt){
  for(const q of P.proj){q.t-=dt;q.x+=q.vx*dt;const o=other(q.owner);
    if(q.k==='fire'&&Math.random()<.6)P.fx.push({x:q.x,y:q.y+(Math.random()-.5)*8,vx:-q.vx*.1,vy:-30,t:.3,c:Math.random()<.5?'#ffb02e':'#ff5a1f',sz:3,round:1});
    if(o.alive&&Math.abs(o.x-q.x)<22&&Math.abs((o.y-30)-q.y)<32){
      if(o.shieldT>0&&q.k==='fire'){q.vx*=-1;q.owner=o;o.shieldT=0;say(o,'反弹！');continue}
      if(o.shieldT>0){q.t=0;o.shieldT=0;say(o,'挡住！');continue}
      if(q.k==='fire'){knock(o,Math.sign(q.vx),11,null);for(let i=0;i<10;i++)P.fx.push({x:q.x,y:q.y,vx:(Math.random()-.5)*240,vy:-Math.random()*200,t:.5,c:'#ffb02e',sz:3,round:1})}
      else{const d=Math.sign(q.owner.x-o.x)||1;o.vx=d*Math.min(620,Math.abs(q.owner.x-o.x)*2.4+200);o.vy=-280;o.stun=.45;o.pct+=6;o.ground=false;o.frozen=0;say(o,'拉过来！','#8fe0cf')}
      q.t=0;}
  }
  P.proj=P.proj.filter(q=>q.t>0&&q.x>-30&&q.x<W+30);
}
function updateBox(dt){
  if(P.state!=='fight')return;
  if(!P.box){P.boxT-=dt;if(P.boxT<=0){const opts=P.plat.solid;const pl=opts[Math.floor(Math.random()*opts.length)];
      P.box={x:pl.x0+20+Math.random()*(pl.x1-pl.x0-40),y:-20,vy:0,p:pl,landed:false};P.banner={a:'神秘宝箱降落！',b:'抢到就换一个新技能',t:1.3}}return}
  const b=P.box;if(!b.landed){b.vy+=900*dt;b.y+=b.vy*dt;if(b.y>=b.p.y){b.y=b.p.y;b.landed=true}}
  for(const f of P.f){if(f.alive&&Math.abs(f.x-b.x)<26&&Math.abs(f.y-b.y)<45){
    const nk=rollSkill(f.skill);f.skill=nk;f.scd=0;say(f,'获得：'+ASK[nk].n,ASK[nk].c);
    for(let i=0;i<16;i++)P.fx.push({x:b.x,y:b.y-10,vx:(Math.random()-.5)*260,vy:-Math.random()*260,t:.7,c:i%2?'#ffd36b':ASK[nk].c,sz:3,round:1});
    P.box=null;P.boxT=8+Math.random()*4;break}}
}
function knockOut(f,how){
  if(P.state!=='fight')return;
  f.alive=false;const win=f.id===1?1:0;P.score[win]++;
  if(how==='lava'){for(let i=0;i<26;i++)P.fx.push({x:f.x,y:LAVA.y,vx:(Math.random()-.5)*260,vy:-Math.random()*420,t:1,c:i%2?'#ffb02e':'#ff5a1f',sz:3+Math.random()*3,round:1});
    P.texts.push({x:f.x,y:LAVA.y-60,t:1.4,s:'烤焦了！',c:'#ffb02e',big:1})}
  P.state='end';P.t=1.8;
  const name=win===0?'蓝方':'红方';P.banner={a:`${name}得分！`,b:`${P.score[0]} : ${P.score[1]}`,t:1.8};
}
function pvpOver(){
  mode='result';overlay.hidden=false;
  const w=P.score[0]>=3?0:1;const name=w===0?'蓝方':(P.cpu?'电脑':'红方');
  overlay.innerHTML=`<div class="panel"><h2>${name}获胜！<small>${P.score[0]} : ${P.score[1]} · Lava Arena</small></h2>
    <p>${P.cpu&&w===1?'电脑赢了。提示：被打得越多，飞得越远。先拉落石机关，再趁对手被砸飞时补一脚。':'再来一局？换个位置，看谁先把谁踢进岩浆。'}</p>
    <div class="row"><button class="btn primary" type="button" id="again">再来一局</button><button class="btn" type="button" id="back">返回地图</button></div></div>`;
  $('again').onclick=()=>startPvp(P.cpu);$('back').onclick=showMap;
}
function drawArena(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1b1420');sky.addColorStop(.6,'#4a1f1a');sky.addColorStop(1,'#8a3a1c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#24161a';for(let i=0;i<8;i++){const x=i*140-30;ctx.beginPath();ctx.moveTo(x,300);ctx.lineTo(x+70,150+(i*47)%80);ctx.lineTo(x+140,300);ctx.fill()}
  // lava
  const now=performance.now()/1000;
  const lg=ctx.createLinearGradient(0,LAVA.y-30,0,H);lg.addColorStop(0,'rgba(255,120,30,.35)');lg.addColorStop(.3,'#ff6a1a');lg.addColorStop(1,'#a3200e');
  ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(LAVA.x0,H+600);for(let x=LAVA.x0;x<=LAVA.x1;x+=10)ctx.lineTo(x,LAVA.y+Math.sin(x*.05+now*3)*3);ctx.lineTo(LAVA.x1,H+600);ctx.fill();
  ctx.fillStyle='#ffd27a';for(let i=0;i<6;i++){const bx=LAVA.x0+((i*53+now*20)%300),by=LAVA.y+8+Math.sin(now*2+i)*3;ctx.beginPath();ctx.arc(bx,by,2+Math.sin(now*4+i)*1.5+1.5,0,7);ctx.fill()}
  // abyss below side floors
  ctx.fillStyle='#120c0e';ctx.fillRect(0,352,LAVA.x0,H+600);ctx.fillRect(LAVA.x1,352,W-LAVA.x1,H+600);
  for(const p of P.plat.solid){
    ctx.fillStyle=p.floor?'#3b3230':'#4a3d38';ctx.fillRect(p.x0,p.y,p.x1-p.x0,p.floor?14:10);
    ctx.fillStyle='#6b5a50';ctx.fillRect(p.x0,p.y,p.x1-p.x0,3);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;for(let x=p.x0+30;x<p.x1;x+=30){ctx.beginPath();ctx.moveTo(x,p.y+3);ctx.lineTo(x,p.y+(p.floor?14:10));ctx.stroke()}
  }
  for(const t of P.plat.tiles){if(t.state==='gone'){ctx.strokeStyle='rgba(255,200,150,.25)';ctx.setLineDash([3,4]);ctx.strokeRect(t.x0,t.y,42,10);ctx.setLineDash([]);continue}
    const sh=t.state==='crack'?(Math.random()-.5)*3:0;
    ctx.fillStyle=t.state==='crack'?'#7a4a30':'#5b4a40';ctx.fillRect(t.x0+sh,t.y,42,10);ctx.fillStyle='#8a7462';ctx.fillRect(t.x0+sh,t.y,42,2);
    if(t.state==='crack'){ctx.strokeStyle='#1a0f0a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(t.x0+10+sh,t.y);ctx.lineTo(t.x0+20+sh,t.y+6);ctx.lineTo(t.x0+30+sh,t.y+10);ctx.stroke()}}
  // lever
  const lv=P.lever,ready=lv.cd<=0;
  ctx.fillStyle='#2a2220';ctx.fillRect(lv.x-8,lv.y-8,16,8);
  const ang=(lv.flip>0||!ready)?.7:-.7;ctx.strokeStyle='#bfb2a5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lv.x,lv.y-6);ctx.lineTo(lv.x+Math.sin(ang)*22,lv.y-6-Math.cos(ang)*22);ctx.stroke();
  ctx.fillStyle=ready?'#ff5a1f':'#6b5d52';ctx.beginPath();ctx.arc(lv.x+Math.sin(ang)*22,lv.y-6-Math.cos(ang)*22,5,0,7);ctx.fill();
  if(ready){ctx.fillStyle='rgba(255,90,31,.85)';ctx.font='12px "Noto Sans SC",sans-serif';ctx.textAlign='center';ctx.fillText('机关',lv.x,lv.y-40)}
  // ceiling
  ctx.fillStyle='#1a1214';ctx.fillRect(0,0,W,14);for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,14);ctx.lineTo(x+12,24+(x*7)%9);ctx.lineTo(x+24,14);ctx.fill()}
}
function drawPvp(){
  paintBack('#1b1420','#120c0e');worldT();drawArena();
  for(const r of P.rocks){
    const p=platUnder(r.x,0,H);const gy=p?p.y:LAVA.y;
    if(r.warn>0){ctx.fillStyle=`rgba(255,60,30,${.25+.25*Math.sin(performance.now()/60)})`;ctx.beginPath();ctx.ellipse(r.x,gy+2,24,6,0,0,7);ctx.fill()}
    else{ctx.fillStyle='#5a4d44';ctx.strokeStyle='#2a221e';ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<7;i++){const a=i/7*Math.PI*2,rr=18+(i%2)*5;ctx.lineTo(r.x+Math.cos(a)*rr,r.y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke()}
  }
  if(P.box){const b=P.box,gl=.5+.5*Math.sin(performance.now()/150);
    ctx.fillStyle=`rgba(255,211,107,${.18+.2*gl})`;ctx.beginPath();ctx.arc(b.x,b.y-10,22,0,7);ctx.fill();
    ctx.fillStyle='#7a4a1e';ctx.fillRect(b.x-12,b.y-18,24,18);ctx.fillStyle='#a8692a';ctx.fillRect(b.x-12,b.y-18,24,6);
    ctx.fillStyle='#ffd36b';ctx.fillRect(b.x-2,b.y-14,4,6);ctx.font='700 14px "Chakra Petch",monospace';ctx.textAlign='center';ctx.fillText('?',b.x,b.y-24)}
  for(const q of P.proj){
    if(q.k==='fire'){const g=ctx.createRadialGradient(q.x,q.y,1,q.x,q.y,13);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#ff8a3d');g.addColorStop(1,'rgba(255,90,31,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,13,0,7);ctx.fill()}
    else{ctx.strokeStyle='#8fe0cf';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(q.owner.x,q.owner.y-32);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([]);
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,6,Math.sign(q.vx)>0?-1.6:1.6,Math.sign(q.vx)>0?1.6:4.7);ctx.stroke()}
  }
  for(const f of P.f){if(!f.alive)continue;
    if(f.comeback){ctx.strokeStyle=`rgba(255,180,60,${.5+.3*Math.sin(performance.now()/120)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(f.x,f.y+2,22,6,0,0,7);ctx.stroke()}
    const u=Object.assign({},f,{lane:f.y-GY,phase:f.ground?f.phase/6:0});
    if(!f.ground){u.swing=f.swing}drawUnit(u);
    if(f.frozen>0){ctx.fillStyle='rgba(170,225,255,.38)';ctx.strokeStyle='rgba(220,245,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(f.x-18,f.y-62,36,64,5);ctx.fill();ctx.stroke()}
    if(f.shieldT>0){ctx.strokeStyle=`rgba(255,211,107,${.5+.4*Math.sin(performance.now()/60)})`;ctx.fillStyle='rgba(255,211,107,.12)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(f.x,f.y-30,38,0,7);ctx.fill();ctx.stroke()}
    ctx.textAlign='center';ctx.font='700 13px "Chakra Petch",monospace';ctx.fillStyle=f.id===1?'#9cc6ff':'#ffb0a6';ctx.fillText(f.id===1?'P1':(P.cpu?'CPU':'P2'),f.x,f.y-66)}
  for(const f of P.fx){if(f.ring){const k=1-f.t/f.t0;ctx.globalAlpha=f.t/f.t0;ctx.strokeStyle=f.c;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,f.y,Math.max(1,f.r*k),Math.max(1,f.r*k*(f.flat?.18:1)),0,0,7);ctx.stroke();continue}
    ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.c;if(f.round){ctx.beginPath();ctx.arc(f.x,f.y,f.sz,0,7);ctx.fill()}else ctx.fillRect(f.x,f.y,f.sz||3,f.sz||3)}
  ctx.globalAlpha=1;
  for(const t of P.texts){ctx.globalAlpha=Math.min(1,t.t*2);ctx.textAlign='center';ctx.font=t.big?'30px "ZCOOL QingKe HuangYou",sans-serif':'700 15px "Chakra Petch",monospace';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(t.s,t.x+1,t.y+1);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y)}
  ctx.globalAlpha=1;
  // HUD (screen space)
  ctx.setTransform(dpr,0,0,dpr,0,0);const bw=Math.min(170,(CW-84)/2);
  const hud=(x,al,f,label,col)=>{ctx.fillStyle='rgba(10,12,16,.6)';ctx.fillRect(al==='left'?x:x-bw,22,bw,66);
    const sk=ASK[f.skill],bx=al==='left'?x+10:x-bw+10;ctx.font='13px "Noto Sans SC",sans-serif';ctx.textAlign=al;ctx.fillStyle=sk.c;
    ctx.fillText(`技：${sk.n}${f.scd<=0?' ✓':''}`,al==='left'?x+10:x-10,82);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(bx,86,bw-20,3);ctx.fillStyle=sk.c;ctx.fillRect(bx,86,(bw-20)*(1-f.scd/sk.cd),3);
    if(f.comeback){ctx.fillStyle='#ffb43c';ctx.font='12px "Noto Sans SC",sans-serif';ctx.fillText('逆袭',al==='left'?x+bw-46:x-bw+46,40)}ctx.textAlign=al;ctx.fillStyle=col;ctx.font='700 13px "Chakra Petch",monospace';
    ctx.fillText(label,al==='left'?x+10:x-10,40);ctx.font='700 22px "Chakra Petch",monospace';ctx.fillStyle=f.pct>100?'#ff6a4d':f.pct>50?'#ffd36b':'#ecebe4';ctx.fillText(Math.round(f.pct)+'%',al==='left'?x+10:x-10,62)};
  hud(14,'left',P.f[0],'蓝方 P1','#9cc6ff');hud(CW-14,'right',P.f[1],P.cpu?'红方 CPU':'红方 P2','#ffb0a6');
  ctx.textAlign='center';ctx.fillStyle='#ecebe4';ctx.font=`700 ${CW<520?20:26}px "Chakra Petch",monospace`;ctx.fillText(`${P.score[0]}:${P.score[1]}`,CW/2,52);
  if(P.banner){const a=Math.min(1,P.banner.t*2);ctx.globalAlpha=a;ctx.fillStyle='rgba(10,12,16,.62)';ctx.fillRect(CW/2-Math.min(250,CW/2-10),96,Math.min(500,CW-20),62);
    ctx.fillStyle='#ffb02e';ctx.font='28px "ZCOOL QingKe HuangYou",sans-serif';ctx.fillText(P.banner.a,CW/2,128);
    ctx.fillStyle='#ecebe4';ctx.font='13px "Noto Sans SC",sans-serif';ctx.fillText(P.banner.b,CW/2,149);ctx.globalAlpha=1}
  if(paused){ctx.fillStyle='rgba(10,12,16,.55)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#ecebe4';ctx.textAlign='center';ctx.font='40px "ZCOOL QingKe HuangYou",sans-serif';ctx.fillText('暂停',CW/2,CH/2)}
}
// PvP input
addEventListener('keydown',e=>{
  if(mode==='help'&&e.key==='Enter'){e.preventDefault();$('okGo').click();return}
  if(mode!=='pvp')return;const m=arenaKey(e);
  if(e.key==='p'){$('pauseBtn').click();return}
  if(!m)return;e.preventDefault();if(m[0]===2&&P.cpu)return;
  if(m[1]==='j'||m[1]==='a'||m[1]==='s'){if(!e.repeat)PK[m[0]][m[1]]=1}else PK[m[0]][m[1]]=1;
});
addEventListener('keyup',e=>{if(mode!=='pvp')return;const m=arenaKey(e);if(m&&(m[1]==='l'||m[1]==='r'))PK[m[0]][m[1]]=0});
addEventListener('blur',()=>{for(const k of [1,2]){PK[k].l=PK[k].r=0}});
for(const id of [1,2]){
  $('pp'+id).insertAdjacentHTML('beforeend',[['l','◀'],['r','▶'],['j','跳'],['a','踢'],['s','技']].map(([k,t])=>`<button class="pb${k==='a'?' kick':k==='s'?' skill':''}" type="button" data-p="${id}" data-k="${k}">${t}</button>`).join(''));
}
document.querySelectorAll('.pb').forEach(el=>{const p=+el.dataset.p,k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{e.preventDefault();PK[p][k]=1;el.classList.add('on')});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>{if(k==='l'||k==='r')PK[p][k]=0;el.classList.remove('on')}));
});

// ---------- loop ----------
let last=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  camUpdate(dt);
  if(mode==='battle'&&!paused)update(dt);
  if(mode==='pvp'&&!paused)updatePvp(dt);
  if((mode==='pvp'||mode==='result')&&P&&!B)drawPvp();else draw();
  uiT+=dt;if(uiT>.1){uiT=0;if(mode==='battle')refreshButtons()}
  requestAnimationFrame(loop);
}
showMap();requestAnimationFrame(loop);
})();
</script>
